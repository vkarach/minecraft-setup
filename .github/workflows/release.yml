name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = uv run python -c "import minecraft_setup; print(minecraft_setup.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
      - run: uv run pytest
      - run: uv run pyinstaller minecraft-setup.spec
      - name: Hash the exe
        shell: pwsh
        run: (Get-FileHash dist/minecraft-setup.exe -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -Encoding ascii dist/minecraft-setup.exe.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/minecraft-setup.exe dist/minecraft-setup.exe.sha256 --title ${{ github.ref_name }} --generate-notes
